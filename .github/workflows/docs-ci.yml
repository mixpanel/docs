name: Docs CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontmatter:
    name: Frontmatter check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontmatter
        run: python scripts/check_frontmatter.py

  code-samples:
    name: Code-sample check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check code samples
        run: python scripts/check_code_samples.py

  links:
    name: Internal-links check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check internal links
        run: python scripts/check_links.py

  redirects:
    name: Redirects check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check redirects
        run: python scripts/check_redirects.py
